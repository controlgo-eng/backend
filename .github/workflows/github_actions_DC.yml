name: Initial Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - release/*
      - develop
      - 'hotfix/*'
  # pull_request:
  #   branches:
  #     - develop
  #     - release/*
  #     - hotfix/*
   
env:   
    IS_DEPLOY: ${{ github.event_name != 'pull_request' }}
    DEPLOY_TO_DEV: ${{ contains(github.ref, 'develop') || contains(github.ref, 'feature') }}
    DEPLOY_TO_QA: ${{ contains(github.ref, 'release') || contains(github.ref, 'bugfix') }}
    DEPLOY_TO_UAT: ${{ contains(github.ref, 'release') || contains(github.ref, 'hotfix') }}
    DEPLOY_TO_PROD: ${{ contains(github.ref, 'release') || contains(github.ref, 'hotfix') }}
    REGISTRY_SERVER_NAME: ${{ (github.event_name == 'pull_request' || contains(github.ref, 'develop') || contains(github.ref, 'feature')) && 'crwsnonprodeastus001.azurecr.io' || (contains(github.ref, 'release') || contains(github.ref, 'bugfix') || contains(github.ref, 'hotfix')) && 'crwsprodbrazilsouth001.azurecr.io' }}
    PROJECT_NAME: 'dotnet-core-template'
    CSPROJ_PATH: './Worldsys.API/Worldsys.API.csproj'
    SLN_PATH: "./*.sln"      
    ARGOCD_SERVER: "argocd.worldsysweb.com"
    APP_VERSION: ${{ github.run_id }}
    DOCKER_FILE: "./Worldsys.API/Dockerfile"    

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:  
        
      - name: Control de variables.
        run: |
          echo imprimo variables IS_DEPLOY: ${{env.IS_DEPLOY}} repository: ${{ github.repository }} token: ${{ secrets.GITHUB_TOKEN }} githubhead_ref: ${{github.head_ref}}  githubref: ${{ github.ref }} githubbase_ref: ${{ github.base_ref}} BRANCH_NAME: ${{github.ref_name}} REGISTRY_SERVER_NAME: ${{env.REGISTRY_SERVER_NAME}} EVENT_NAME: ${{github.event_name}} DEPLOY_TO_DEV: ${{env.DEPLOY_TO_DEV}}, DEPLOY_TO_QA: ${{env.DEPLOY_TO_QA}}, DEPLOY_TO_UAT: ${{env.DEPLOY_TO_UAT}}, DEPLOY_TO_PROD: ${{env.DEPLOY_TO_PROD}}, REGISTRY_SERVER_NAME: ${{env.REGISTRY_SERVER_NAME}}          

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}        

    # - name: Login to Azure Container Registry
    #   uses: azure/docker-login@v1
    #   with:
    #     login-server: ${{ secrets.REGISTRY_URL }}        
    #     username: ${{ secrets.REGISTRY_USERNAME }}
    #     password: ${{ secrets.REGISTRY_PASSWORD }}    
    #     # run: |
    #     #   docker build . -t ${{ github.event.client_payload.REGISTRY_SERVER_NAME }}/${{ github.event.client_payload.PROJECT_NAME }}:${{ github.event.client_payload.APP_VERSION }}
    #     #   docker push ${{ github.event.client_payload.REGISTRY_SERVER_NAME }}/${{ github.event.client_payload.PROJECT_NAME }}:${{ github.event.client_payload.APP_VERSION }}

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: build & push docker image
        with:
          image: ${{env.REGISTRY_SERVER_NAME}}/${{ env.PROJECT_NAME }}:${{ env.APP_VERSION }}
          tags: v1, latest
          registry: ${{ env.REGISTRY_SERVER_NAME }}
          dockerfile: ${{ env.DOCKER_FILE }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

    # OPCION 2
    # - name: Build Docker image
    #   uses: docker/build-push-action@v2
    #   with:        
    #     context: .
    #     file: ${{ github.event.client_payload.DOCKER_FILE }}
    #     push: true
    #     tags: |
    #       ${{ github.event.client_payload.REGISTRY_SERVER_NAME }}/${{ github.event.client_payload.PROJECT_NAME }}:${{ github.event.client_payload.APP_VERSION }}


      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: "./helpm"
          config: "/helm/Chart.yaml"
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          
      - name: Ejecutar análisis de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY_SERVER_NAME }}/${{ env.PROJECT_NAME }}:${{ env.APP_VERSION }}
            
  deploy_to_dev:    
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && contains(github.ref, 'develop') || contains(github.ref, 'feature')  && success()
    steps:
      - name: Deploy to Dev - Helm build and Deploy process
        uses: peter-evans/repository-dispatch@v3
        with:
          # token: ${{ secrets.PAT }}
          repository: $ {{ github.repository }}
          event-type: deploy-pipeline-event
          client-payload: '{ environment: "dev", PROJECT_NAME: ${{env.PROJECT_NAME}}, APP_VERSION: ${{env.APP_VERSION}}}'
  deploy_to_qa:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && contains(github.ref, 'release') || contains(github.ref, 'bugfix') && success()
    steps:
      - name: Deploy to Qa - Helm build and Deploy process
        uses: peter-evans/repository-dispatch@v3
        with:
          # token: ${{ secrets.PAT }}
          repository: $ {{ github.repository }}
          event-type: deploy-pipeline-event
          client-payload: '{ environment: "qa", PROJECT_NAME: ${{env.PROJECT_NAME}}, APP_VERSION: ${{env.APP_VERSION}}}'  
  deploy_to_prod:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && contains(github.ref, 'release') || contains(github.ref, 'hotfix') && success()
    steps:
      - name: Deploy to Prod - Helm build and Deploy process
        uses: peter-evans/repository-dispatch@v3
        with:
          # token: ${{ secrets.PAT }}
          repository: $ {{ github.repository }}
          event-type: deploy-pipeline-event
          client-payload: '{ environment: "prod", PROJECT_NAME: ${{env.PROJECT_NAME}}, APP_VERSION: ${{env.APP_VERSION}}}'

  