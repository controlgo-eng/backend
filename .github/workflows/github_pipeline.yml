name: Initial Pipeline

on:
 push:
    branches:
      - release/*
      - develop
      - 'hotfix/*'
 pull_request:
    branches:
      - develop
    types: [opened, reopened]    
    
env:      
    DEPLOY_TO_DEV: ${{ contains(github.event_name, 'pull_request') && false || contains(github.base_ref, 'develop') && true || contains(github.base_ref, 'feature') && true || false }}
    DEPLOY_TO_QA: ${{ contains(github.event_name, 'pull_request') && false || contains(github.base_ref, 'release') && true || contains(github.base_ref, 'bugfix') && true || false }}
    DEPLOY_TO_UAT: ${{ contains(github.event_name, 'pull_request') && false || contains(github.base_ref, 'release') && true || contains(github.base_ref, 'hotfix') && true || false }}
    DEPLOY_TO_PROD: ${{ contains(github.event_name, 'pull_request') && false || contains(github.base_ref, 'release') && true || contains(github.base_ref, 'hotfix') && true || false }}
    REGISTRY_SERVER_NAME: ${{ contains(github.base_ref, 'develop') && 'crwsnonprodeastus001.azurecr.io' || contains(github.base_ref, 'feature') && 'crwsnonprodeastus001.azurecr.io' || contains(github.base_ref, 'release') && 'crwsprodbrazilsouth001' || contains(github.base_ref, 'bugfix') && 'crwsprodbrazilsouth001' || contains(github.base_ref, 'hotfix') && 'crwsprodbrazilsouth001' || '' }}  
    PROJECT_NAME: 'dotnet-core-template'
    CSPROJ_PATH: './Worldsys.API/Worldsys.API.csproj'
    SLN_PATH: "./*.sln"      
    ARGOCD_SERVER: "argocd.worldsysweb.com"
    APP_VERSION: ${{github.run_id}}
    DOCKER_FILE: "./Dockerfile"

jobs:
  build:
    runs-on: ubuntu-latest
         
    steps:  
      - name: Control de variables.
        run: |
          echo imprimo variables githubref: ${{ github.ref }} githubbase_ref: ${{ github.base_ref}} BRANCH_NAME: ${{github.ref_name}} REGISTRY_SERVER_NAME: ${{env.REGISTRY_SERVER_NAME}} EVENT_NAME: ${{github.event_name}} DEPLOY_TO_DEV: ${{env.DEPLOY_TO_DEV}}, DEPLOY_TO_QA: ${{env.DEPLOY_TO_QA}}, DEPLOY_TO_UAT: ${{env.DEPLOY_TO_UAT}}, DEPLOY_TO_PROD: ${{env.DEPLOY_TO_PROD}}, REGISTRY_SERVER_NAME: ${{env.REGISTRY_SERVER_NAME}}

      - name: Build and Docker Build
        uses: peter-evans/repository-dispatch@v3
        with:
          # token: ${{ secrets.PAT }}
          repository: $ {{ github.repository }}
          event-type: build-pipeline-event
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", base_branch: ${{ github.base_ref}} , DEPLOY_TO_DEV: ${{env.DEPLOY_TO_DEV}}, DEPLOY_TO_QA: ${{env.DEPLOY_TO_QA}}, DEPLOY_TO_UAT: ${{env.DEPLOY_TO_UAT}}, DEPLOY_TO_PROD: ${{env.DEPLOY_TO_PROD}}, REGISTRY_SERVER_NAME: ${{env.REGISTRY_SERVER_NAME}}, PROJECT_NAME: ${{env.PROJECT_NAME}}, CSPROJ_PATH: ${{env.CSPROJ_PATH}}, APP_VERSION: ${{env.APP_VERSION}}, DOCKER_FILE: ${{env.DOCKER_FILE}} }'

  
