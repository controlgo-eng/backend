name: Initial Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - release/*
      - develop
      - hotfix/*
    types: [opened, reopened]
jobs:
  build:
    runs-on: ubuntu-latest
    env:      
      DEPLOY_TO_DEV: ${{ contains(github.event_name, 'pull_request') && false || contains(github.ref, 'develop') && true || contains(github.ref, 'feature') && true || false }}
      DEPLOY_TO_QA: ${{ contains(github.event_name, 'pull_request') && false || contains(github.ref, 'release') && true || contains(github.ref, 'bugfix') && true || false }}
      DEPLOY_TO_AUT: ${{ contains(github.event_name, 'pull_request') && false || contains(github.ref, 'release') && true || contains(github.ref, 'hotfix') && true || false }}
      DEPLOY_TO_PROD: ${{ contains(github.event_name, 'pull_request') && false || contains(github.ref, 'release') && true || contains(github.ref, 'hotfix') && true || false }}
      REGISTRY_SERVER_NAME: ${{ contains(github.ref, 'develop') && 'crwsnonprodeastus001.azurecr.io' || contains(github.ref, 'feature') && 'crwsnonprodeastus001.azurecr.io' || contains(github.ref, 'release') && 'crwsprodbrazilsouth001' || contains(github.ref, 'bugfix') && 'crwsprodbrazilsouth001' || contains(github.ref, 'hotfix') && 'crwsprodbrazilsouth001' || '' }}  
      PROJECT_NAME: 'dotnet-core-template'
      CSPROJ_PATH: './Worldsys.API/Worldsys.API.csproj'
      SLN_PATH: "./*.sln"      
      ARGOCD_SERVER: "argocd.worldsysweb.com"
      APP_VERSION: ${{github.run_id}}
      DOCKER_FILE: "./Dockerfile"
      
    steps:  
      - name: Control de variables.
        run: |
          echo imprimo variables DEPLOY_TO_DEV: ${{env.DEPLOY_TO_DEV}}, DEPLOY_TO_QA: ${{env.DEPLOY_TO_QA}}, DEPLOY_TO_UAT: ${{env.DEPLOY_TO_UAT}}, DEPLOY_TO_PROD: ${{env.DEPLOY_TO_PROD}}, REGISTRY_SERVER_NAME: ${{env.REGISTRY_SERVER_NAME}}

      - name: Build and Docker Build
        uses: peter-evans/repository-dispatch@v3
        with:
          # token: ${{ secrets.PAT }}
          repository: $ {{ github.repository }}
          event-type: build-pipeline-event
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", base_branch: $ {{ github.base_ref}} , DEPLOY_TO_DEV: ${{env.DEPLOY_TO_DEV}}, DEPLOY_TO_QA: ${{env.DEPLOY_TO_QA}}, DEPLOY_TO_UAT: ${{env.DEPLOY_TO_UAT}}, DEPLOY_TO_PROD: ${{env.DEPLOY_TO_PROD}}, REGISTRY_SERVER_NAME: ${{env.REGISTRY_SERVER_NAME}}, PROJECT_NAME: ${{env.PROJECT_NAME}}, CSPROJ_PATH: ${{env.CSPROJ_PATH}}, APP_VERSION: ${{env.APP_VERSION}}, DOCKER_FILE: ${{env.DOCKER_FILE}} }'

  
  deploy_to_dev:
      runs-on: ubuntu-latest
      needs: build

      if: ${{ contains(DEPLOY_TO_DEV, 'true') }}
      steps:
        - name: Deploy to Dev - Helm build and Deploy process
          uses: peter-evans/repository-dispatch@v3
          with:
            # token: ${{ secrets.PAT }}
            repository: $ {{ github.repository }}
            event-type: deploy-pipeline-event
            client-payload: '{ environment: "dev", PROJECT_NAME: ${{env.PROJECT_NAME}}, APP_VERSION: ${{env.APP_VERSION}}}'
  deploy_to_qa:
      runs-on: ubuntu-latest
      needs: build
      if: ${{ contains(DEPLOY_TO_QA, 'true') }}
      steps:
        - name: Deploy to Qa - Helm build and Deploy process
          uses: peter-evans/repository-dispatch@v3
          with:
            # token: ${{ secrets.PAT }}
            repository: $ {{ github.repository }}
            event-type: deploy-pipeline-event
            client-payload: '{ environment: "qa", PROJECT_NAME: ${{env.PROJECT_NAME}}, APP_VERSION: ${{env.APP_VERSION}}}'  
  deploy_to_prod:
      runs-on: ubuntu-latest
      needs: build
      if: ${{ contains(DEPLOY_TO_PROD, 'true') }}
      steps:
        - name: Deploy to Prod - Helm build and Deploy process
          uses: peter-evans/repository-dispatch@v3
          with:
            # token: ${{ secrets.PAT }}
            repository: $ {{ github.repository }}
            event-type: deploy-pipeline-event
            client-payload: '{ environment: "prod", PROJECT_NAME: ${{env.PROJECT_NAME}}, APP_VERSION: ${{env.APP_VERSION}}}'

  